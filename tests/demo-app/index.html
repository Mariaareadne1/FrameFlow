<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
<title>FrameFlow Demo Target</title>
<style>
  body { margin: 0; font: 15px -apple-system, sans-serif; background: #f5f6fa; color: #1d2130; }
  header { height: 56px; background: #1d2130; color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  header button { background: #ffffff1a; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; }
  main { display: grid; grid-template-columns: 200px 1fr; height: calc(100vh - 56px); }
  nav { background: #e4e7ef; padding: 16px; }
  nav a { display: block; padding: 8px 10px; border-radius: 6px; color: inherit; text-decoration: none; }
  nav a.active { background: #5b7cfa; color: #fff; }
  section { padding: 24px; overflow: auto; }
  .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px #0001; }
  input { font: inherit; padding: 8px 10px; border: 1px solid #ccd; border-radius: 8px; width: 260px; }
  .primary { background: #5b7cfa; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; }
  #menu { display: none; position: absolute; top: 52px; left: 20px; background: #fff; color: #1d2130; border-radius: 10px; box-shadow: 0 10px 30px #0003; padding: 6px; }
  #menu.open { display: block; }
  #menu div { padding: 8px 14px; border-radius: 6px; }
  #count { font-size: 40px; font-weight: 700; }
</style>
</head>
<body>
<header><button id="menuBtn">File ▾</button><span>Acme Dashboard</span></header>
<div id="menu"><div>New project</div><div>Open…</div><div>Export</div></div>
<main>
  <nav><a class="active" href="#">Overview</a><a href="#">Reports</a><a href="#">Settings</a></nav>
  <section>
    <div class="card"><h2>Create a project</h2><input id="name" placeholder="Project name" /> <button class="primary" id="create">Create</button></div>
    <div class="card"><div>Projects created</div><div id="count">0</div></div>
    <div class="card" style="height:600px">Scroll me — lots of content below.</div>
  </section>
</main>
<script>
  document.getElementById('menuBtn').onclick = () => document.getElementById('menu').classList.toggle('open')
  // A short, quiet tone for system-audio capture tests.
  window.playTone = (freq = 523, seconds = 2) => {
    const ctx = new AudioContext()
    const osc = ctx.createOscillator()
    const gain = ctx.createGain()
    osc.frequency.value = freq
    gain.gain.value = 0.08
    osc.connect(gain).connect(ctx.destination)
    osc.start()
    osc.stop(ctx.currentTime + seconds)
  }
  document.getElementById('create').onclick = () => { const c = document.getElementById('count'); c.textContent = String(Number(c.textContent) + 1) }
</script>
</body>
</html>
